services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_dashboard
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://student:student@db:5432/student_dashboard
      AUTO_CREATE_DB: "false"
    ports:
      - "5000:5000"
    volumes:
      - avatar_data:/app/uploads/avatars
      - material_data:/app/uploads/materials
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  avatar_data:
  material_data:
